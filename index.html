<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#020d18">
    <meta name="description" content="Classificação final do Torneio de Truco da Associação Volvo 2026.">
    <title>Torneio de Truco AV 2026</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/ranking-data.js" defer></script>
    <script src="assets/js/app.js" defer></script>
  </head>
  <body>
    <button class="pdf-button" id="download-pdf" type="button" aria-label="Exportar apresentação para PDF">
      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v3h14v-3" /></svg>
      <span>Baixar PDF</span>
    </button>

    <main class="deck" aria-label="Apresentação do Torneio de Truco AV 2026">
      <section class="slide cover active" aria-labelledby="cover-title">
        <h1 id="cover-title">TORNEIO DE<br><span>TRUCO</span> AV 2026</h1>
      </section>

      <section class="slide podium-slide" aria-labelledby="podium-title" hidden>
        <div class="eyebrow">Ranking de Truco AV 2026</div>
        <h2 id="podium-title">Destaque das Primeiras Colocações</h2>
        <div class="podium" id="podium" aria-label="Pódio"></div>
        <div class="footer"><span>TORNEIO DE TRUCO AV 2026</span><span>02 / 04</span></div>
      </section>

      <section class="slide highlights-slide" aria-labelledby="highlights-title" hidden>
        <div class="eyebrow">Destaques da temporada</div>
        <h2 id="highlights-title">Participantes premiados • 1º ao 6º lugar</h2>
        <div class="six-grid" id="highlights"></div>
        <div class="footer"><span>TORNEIO DE TRUCO AV 2026</span><span>03 / 04</span></div>
      </section>

      <section class="slide ranking-slide" aria-labelledby="ranking-title" hidden>
        <div class="eyebrow eyebrow-centered">Após 10 etapas</div>
        <h2 id="ranking-title">Classificação final</h2>
        <div class="columns" id="columns" aria-label="Classificação completa"></div>
        <div class="footer"><span>ASSOCIAÇÃO VOLVO • 2026</span><span>04 / 04</span></div>
      </section>
    </main>

    <div class="counter" id="counter" aria-live="polite" aria-atomic="true">1 / 4</div>
    <nav class="controls" aria-label="Navegação dos slides">
      <button type="button" id="previous" aria-label="Ir para o slide anterior">← Anterior</button>
      <button type="button" id="next" aria-label="Ir para o próximo slide">Próximo →</button>
    </nav>
    <noscript>Ative o JavaScript para visualizar o ranking completo do torneio.</noscript>
  </body>
</html>
